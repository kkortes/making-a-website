<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Making a website</title>
  <!-- This page is served at every step's address, so it names its one manifest, as Vibe's SPA shell does -->
  <script>window.__MANIFEST__ = '/vibe-hyperspeed/index.html.manifest.js'</script>
  <script type="module">
    import vibe from '/node_modules/@ape-egg/vibe/index.js'
    import { setupSpa, resolve, navigate } from '/node_modules/@ape-egg/vibe/spa.js'
    import codie from '/node_modules/@ape-egg/codie/codie.js'

    const steps = await (await fetch('/steps.json')).json()

    // A step's CSS reaches only its own step, even mid-sweep with two steps on the page: rules on the page root
    // (html) stay on the page, the rest is scoped to the step's <component>, the parent of its <style>s
    const onPage = rule => rule instanceof CSSStyleRule && document.documentElement.matches(rule.selectorText)
    const scoped = css => {
      const sheet = new CSSStyleSheet()
      sheet.replaceSync(css)
      const rules = [...sheet.cssRules]
      const text = rules => rules.map(rule => rule.cssText).join('\n')
      return `${text(rules.filter(onPage))}\n@scope {\n${text(rules.filter(rule => !onPage(rule)))}\n}`
    }

    // The step as it mounts: its own files (or their code-mode drafts), each stylesheet inlined and scoped;
    // a step links them from its own root (/style.css), and a code-mode <link> to a file the step doesn't have inlines nothing.
    // A <link> to the site's own stylesheet (/stylecheat.css, in the step's `site`) stays as it is.
    // One of the step's components, as <component src="/components/Layout.html"> or a tag named after it (<Layout>),
    // mounts inline with its children in the component's <slot>, as Vibe's compiler inlines it, so it renders its code-mode draft too;
    // a component can hold another (PageContent.html nested in Layout.html), so inlining runs until none is left.
    // A component drops <body>, so the step's body becomes a <step-body> that keeps its attributes.
    // Any of the step's pages mounts the same way; a link to one (/pages/about-me.html, or /about-me in an SPA) goes to its address (/7/about-me.html, /8/about-me)
    // A module script's import of one of the step's own files (/state.js) loads that file (or its code-mode draft), its links to pages ('/about-me') pointed at their addresses too
    // A hoisted step's `shell` is its home page with the step's outlet in its layout's <slot>, and a page's `fragment` only what's in its layout
    const mounted = ({ files, site, links, route }, drafts = {}, page = 'index.html', part) => {
      const text = path => drafts[path] ?? files.find(file => file.path === path)?.after ?? ''
      const doc = new DOMParser().parseFromString(text(page), 'text/html')
      const components = componentsOf(files)
      const [layout] = part ? [...doc.body.children].filter(element => !element.matches('script, style')) : []
      if (part === 'shell') layout.innerHTML = `<component src="@[outlets['${route}']]"></component>`
      if (part === 'fragment') layout.replaceWith(...layout.childNodes)
      while (components.some(([, selector]) => doc.querySelector(selector))) components.forEach(([path, selector]) => doc.querySelectorAll(selector).forEach(tag => tag.outerHTML = `<component>${text(path).replace('<slot></slot>', () => `<slot>${tag.innerHTML}</slot>`)}</component>`))
      doc.querySelectorAll(`link[rel="stylesheet"]${site.map(path => `:not([href="/${path}"])`).join('')}`).forEach(link => link.replaceWith(Object.assign(doc.createElement('style'), { textContent: text(link.getAttribute('href').slice(1)) })))
      doc.querySelectorAll('style').forEach(style => style.textContent = scoped(style.textContent))
      doc.querySelectorAll(Object.keys(links).map(href => `a[href="${href}"]`).join()).forEach(link => link.setAttribute('href', links[link.getAttribute('href')]))
      const module = path => blob(Object.entries(links).reduce((code, [href, address]) => code.replaceAll(`'${href}'`, `'${address}'`), text(path)), 'text/javascript')
      doc.querySelectorAll('script[type="module"]').forEach(script => script.textContent = script.textContent.replace(/from '\/([^']+)'/g, (match, path) => text(path) ? `from '${module(path)}'` : match))
      if (part === 'fragment') return doc
      const body = doc.createElement('step-body')
      for (const { name, value } of doc.body.attributes) body.setAttribute(name, value)
      body.append(...doc.body.childNodes)
      doc.body.append(body)
      return doc
    }

    // One address per distinct text, so a page or draft that mounts the same as before keeps its address and stays mounted
    const blobs = {}
    const blob = (text, type = 'text/html') => blobs[text] ??= URL.createObjectURL(new Blob([text], { type }))
    const html = doc => blob(doc.documentElement.outerHTML)

    const componentsOf = files => files.map(file => file.after && file.path.match(/^components\/([^/]+)\.html$/)).filter(Boolean).map(([path, name]) => [path, `${name}, component[src="/${path}"]`])
    // The layout a page's body is alone (scripts and styles aside), as <Layout> or <component src="/components/Layout.html">
    const layoutOf = (files, page) => {
      const [layout, ...rest] = [...new DOMParser().parseFromString(files.find(file => file.path === page).after, 'text/html').body.children].filter(element => !element.matches('script, style'))
      return !rest.length && layout?.matches(componentsOf(files).map(([, selector]) => selector).join()) && layout.cloneNode().outerHTML
    }
    // An SPA step whose pages are each the same one layout hoists it, as Vibe's compiler does into its shell:
    // the layout mounts once and moving between the step's pages swaps only what's in its <slot>
    const hoisted = steps.map(({ spa, files, pages }) => spa && Object.keys(pages).map(page => layoutOf(files, page)).every((layout, _, layouts) => layout && layout === layouts[0]))
    const home = ({ pages, route }) => Object.keys(pages).find(page => pages[page] === route)

    // Every page of every step is a route, in step order; every page of a hoisted step routes to its one shell
    const routes = steps.flatMap((step, index) => Object.entries(step.pages).map(([page, route]) => ({ route, src: html(hoisted[index] ? mounted(step, {}, home(step), 'shell') : mounted(step, {}, page)) })))
    // What each hoisted step's outlet holds, by step: the fragment of the page at an address
    const fragments = Object.fromEntries(steps.flatMap((step, index) => hoisted[index] ? Object.entries(step.pages).map(([page, route]) => [route, html(mounted(step, {}, page, 'fragment'))]) : []))
    const outlet = path => ({ [steps[at(path)].route]: fragments[path] })

    const at = path => steps.findIndex(step => Object.values(step.pages).includes(path))
    // The page at an address: its step and the file it mounts
    const pageAt = path => ({ step: at(path), file: Object.keys(steps[at(path)].pages).find(page => steps[at(path)].pages[page] === path) })

    // Ticking step 1's box reveals the diff pane, which stays from step 2 on;
    // ticking Adding styles' box reveals the file tree (and code mode), which stays from step 3 on
    const panes = (path, ticked) => ({
      diffs: at(path) > 0 || ticked ? 'diffs' : '',
      files: at(path) > at('/2') || (path === '/2' && ticked) ? 'files' : '',
    })

    // Stylecheat's colour for each file state's badge in the file tree
    const colours = { added: 'green', modified: 'yellow', moved: 'blue' }

    window.$ = vibe({ page: { ...resolve(location, routes), ...pageAt(location.pathname) }, steps, navigate, panes: panes(location.pathname, false), colours, ticked: false, open: pageAt(location.pathname).file, mode: '', drafts: {}, shown: [], sweep: { position: 1 }, outlets: outlet(location.pathname) })
    // The sweep starts in the same update as the page, so the outgoing step keeps its rendered row;
    // another page of the same step just swaps in, with no sweep, and in a hoisted step only its outlet does
    setupSpa({
      routes,
      onNavigate: ({ path, route, params, src, name }) => {
        const page = { path, route, params, src, name, ...pageAt(path) }
        $.outlets = { ...$.outlets, ...outlet(path) }
        $.sweep = page.step === $.page.step ? { position: 1 } : {
          from: $.page.src,
          direction: page.step > $.page.step ? 'forward' : 'back',
          position: 1,
        }
        $.page = page
      },
    })

    // Each step's Next calls nextStep(); it lives here, outside the step files, and moves on through the router
    window.nextStep = () => navigate(steps[$.page.step + 1].route)

    // Each changed file's diff is a codie in diff mode, redrawn when the step's file or its code-mode draft changes;
    // a diff over 500 lines has no codie until its button shows it (`shown`), so it's never drawn upfront
    const diffs = new WeakMap()
    const redraw = ({ page, drafts }) => document.querySelectorAll('diff-list codie').forEach(el => {
      const file = steps[page.step].files.find(file => file.path === el.dataset.path)
      const code = drafts[file.path] ?? file.after
      if (!diffs.has(el)) {
        el.toggleAttribute(`highlight-${file.path.split('.').pop()}`)
        diffs.set(el, codie({ el, diff: true, numberedRows: true, before: file.before }))
      }
      if (diffs.get(el).code !== code) diffs.get(el).code = code
    })

    let editor

    $.on('afterUpdate', ({ page, mode, ticked, open }, prev) => {
      if (ticked !== prev.ticked) $.panes = panes(page.path, ticked)
      // The page's own file shows it rendered; any other file only opens in code mode
      if (open !== prev.open) $.mode = open === page.file ? '' : 'code'
      // Code mode edits the open file itself: an HTML file re-renders the content, a CSS file restyles it
      if (mode && (!prev.mode || open !== prev.open)) {
        const content = document.querySelector('stage > component:last-of-type')
        if (!prev.mode) editor = codie(document.querySelector('stage > codie'))
        Object.assign(editor, {
          code: $.drafts[open] ?? steps[page.step].files.find(file => file.path === open).after,
          editable: true,
          numberedRows: true,
          onEdit: ({ raw }) => {
            $.drafts = { ...$.drafts, [open]: raw }
            // A hoisted step re-renders through its shell and outlet: an edit inside the layout remounts only the outlet,
            // and leaving the page routes back to the clean shell, dropping the edits
            if (hoisted[page.step]) {
              $.outlets = { ...$.outlets, [steps[page.step].route]: html(mounted(steps[page.step], $.drafts, page.file, 'fragment')) }
              $.page = { ...$.page, src: html(mounted(steps[page.step], $.drafts, home(steps[page.step]), 'shell')) }
              return
            }
            const doc = mounted(steps[page.step], $.drafts, page.file)
            if (open.endsWith('.html')) content.innerHTML = doc.documentElement.innerHTML
            else if (open.endsWith('.css')) content.querySelectorAll('style').forEach((style, index) => style.textContent = doc.querySelectorAll('style')[index].textContent)
          },
        })
      }
      if (page.path === prev.page.path) return
      $.ticked = false
      $.panes = panes(page.path, false)
      $.open = page.file
      $.mode = ''
      $.drafts = {}
      $.shown = []
    })

    // Pane changes animate only once the page is up, so a direct load shows them in place;
    // the diffs draw from then on too, settling being their first update
    $.on('ready', () => {
      $.on('afterUpdate', redraw)
      $.settled = 'settled'
    })
  </script>
</head>
<body>
  <component src="/components/Layout.html"></component>
</body>
</html>
